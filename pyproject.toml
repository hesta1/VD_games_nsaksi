[project]
name = "VD_games"
version = "0.1.0"
description = "A small collection of console brain-training games"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["VD_games"]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
]

[project.scripts]
VD-games = "VD_games.scripts.VD_games:main"
VD-calc = "VD_games.scripts.VD_calc:main"
VD-gcd = "VD_games.scripts.VD_gcd:main"
VD-even = "VD_games.scripts.VD_even:main"
